# Pre-commit hooks configuration
# See https://pre-commit.com for more information
#
# Install locally with:
#   pip install pre-commit
#   pre-commit install
# Run against everything with:
#   pre-commit run --all-files
#
# CI runs these same hooks (see .github/workflows/ci.yml), so what passes
# locally is what passes on GitHub.

repos:
  # Basic text file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Remove trailing whitespace
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      # Ensure files end with a newline
      - id: end-of-file-fixer
      # Check YAML syntax
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags in Django templates
      # Check for large files being added
      - id: check-added-large-files
        args: [--maxkb=1000]
      # Check for unresolved merge conflicts
      - id: check-merge-conflict
      # Detect leftover debug statements
      - id: debug-statements
      # Detect private keys
      - id: detect-private-key
      # Check JSON syntax
      - id: check-json
      # Check for files that would conflict on case-insensitive filesystems
      - id: check-case-conflict
      # Check for Python syntax errors
      - id: check-ast
      # Check for mixed line endings
      - id: mixed-line-ending
        args: [--fix=lf]

  # Ruff - Fast Python linter (replaces flake8, isort, etc.)
  # Rules and exclusions live in ruff.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # Run the linter (`ruff-check`; the bare `ruff` id is a legacy alias)
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter
      - id: ruff-format

  # Local custom hooks
  - repo: local
    hooks:
      # Prevent committing .env files with secrets (defense in depth).
      #
      # Uses pre-commit's built-in `fail` language, which trips whenever a file
      # matches `files` below, rather than shelling out to `git diff --cached`.
      # That matters for the case this hook exists for: someone bypassing the
      # local hook with --no-verify and pushing. On CI's clean checkout the
      # index already matches HEAD, so `git diff --cached` is empty and a
      # shell-based check silently passes. Letting pre-commit supply the
      # filenames means the same rule applies at commit time and under
      # `--all-files` in CI.
      #
      # Deny by default: match every .env* and allow back only the known
      # template names. An allowlist of suffixes silently misses variants like
      # .env.staging or .env.test, which .gitignore's `.env` entry doesn't
      # cover either - so those would commit with no friction at all.
      - id: forbid-dotenv
        name: forbid .env files (secrets)
        entry: >-
          Do not commit .env files - they hold secrets.
          Templates such as .env.example are fine.
        language: fail
        files: '(^|/)\.env(\..+)?$'
        exclude: '\.env\.(example|template|sample)$'

# Global exclusions
exclude: |
  (?x)^(
      kioblog/migrations/.*|
      kioblog/static/kioblog/code\.css|
      __pycache__/.*|
      .*\.pyc|
      .*\.pyo|
      .*\.egg-info/.*|
      build/.*|
      dist/.*|
      \.git/.*|
      \.venv/.*|
      venv/.*|
      media/.*
  )$
