# Pre-commit hooks configuration
# See https://pre-commit.com for more information
#
# Install locally with:
#   pip install pre-commit
#   pre-commit install
# Run against everything with:
#   pre-commit run --all-files
#
# CI runs these same hooks (see .github/workflows/ci.yml), so what passes
# locally is what passes on GitHub.

repos:
  # Basic text file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Remove trailing whitespace
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      # Ensure files end with a newline
      - id: end-of-file-fixer
      # Check YAML syntax
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags in Django templates
      # Check for large files being added
      - id: check-added-large-files
        args: [--maxkb=1000]
      # Check for unresolved merge conflicts
      - id: check-merge-conflict
      # Detect leftover debug statements
      - id: debug-statements
      # Detect private keys
      - id: detect-private-key
      # Check JSON syntax
      - id: check-json
      # Check for files that would conflict on case-insensitive filesystems
      - id: check-case-conflict
      # Check for Python syntax errors
      - id: check-ast
      # Check for mixed line endings
      - id: mixed-line-ending
        args: [--fix=lf]

  # Ruff - Fast Python linter (replaces flake8, isort, etc.)
  # Rules and exclusions live in ruff.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # Run the linter (`ruff-check`; the bare `ruff` id is a legacy alias)
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter
      - id: ruff-format

  # Local custom hooks
  - repo: local
    hooks:
      # Prevent committing .env files with secrets (defense in depth)
      - id: forbid-dotenv
        name: forbid .env files (secrets)
        entry: bash -c
        args:
          - |
            FILES=$(git diff --cached --name-only | grep -E "(^|/)\.env(\.local|\.production|\.development)?$" | grep -v -E "\.env\.(example|template|sample)$")
            if [ -n "$FILES" ]; then
              echo "❌ ERROR: Do not commit .env files!"
              echo "$FILES"
              echo "These files contain secrets and should never be committed."
              echo "Files like .env.example are allowed."
              exit 1
            fi
        language: system
        pass_filenames: false
        always_run: false

# Global exclusions
exclude: |
  (?x)^(
      kioblog/migrations/.*|
      kioblog/static/kioblog/code\.css|
      __pycache__/.*|
      .*\.pyc|
      .*\.pyo|
      .*\.egg-info/.*|
      build/.*|
      dist/.*|
      \.git/.*|
      \.venv/.*|
      venv/.*|
      media/.*
  )$
