name: Tag release

# Cuts the release tag. Manual on purpose: merging to main and deciding "this
# is a release" are separate calls, so several PRs can land before a version is
# cut.
#
# You pick which part of the version moves; the workflow reads the highest
# existing release tag and does the arithmetic. Nothing is typed by hand, so
# there is no version to mistype and none stored in the code - setuptools_scm
# reads the tag at build time, which makes the tag the single source of truth.
#
# This does NOT publish. Tags pushed with GITHUB_TOKEN deliberately do not start
# other workflows ("Events triggered by the GITHUB_TOKEN will not create a new
# workflow run"), so publishing stays a second, explicit action: run the
# "Publish to PyPI" workflow and give it the tag this one printed.
#
# As in publish.yml, `${{ ... }}` never appears inside a `run:` block - Actions
# interpolates those textually before the shell sees them. Values arrive via
# `env:` and are used as quoted shell variables.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to increment"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  tag:
    name: Create and push tag
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the tag back to the repository.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so every existing tag is visible to the version maths.
          fetch-depth: 0

      # Releases come off main. Dispatching this against a feature branch would
      # tag a commit that never went through review.
      - name: Refuse to tag anything but main
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main; this run targeted ${GITHUB_REF}."
            exit 1
          fi

      - name: Work out the next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import subprocess
          import sys

          # Only canonical vX.Y.Z tags count. This repo also carries older
          # v0.1-alpha style tags, and letting those into the comparison would
          # make the arithmetic meaningless.
          TAG_RE = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")

          def git(*args):
              return subprocess.run(
                  ["git", *args], capture_output=True, text=True, check=True
              ).stdout.strip()

          releases = []
          for tag in git("tag", "--list", "v*").split():
              m = TAG_RE.match(tag)
              if m:
                  releases.append((tuple(int(p) for p in m.groups()), tag))

          # Refuse to tag a commit that is already a release. Without this,
          # running this workflow twice with no commits in between would put two
          # different version numbers on the same code.
          head = git("rev-parse", "HEAD")
          for _, tag in releases:
              if git("rev-list", "-n", "1", tag) == head:
                  print(
                      f"::error::HEAD is already released as {tag}. "
                      f"Merge something before cutting another version.",
                      file=sys.stderr,
                  )
                  raise SystemExit(1)

          if releases:
              (major, minor, patch), latest = max(releases)
          else:
              # First release in a repo with no vX.Y.Z tags yet.
              major = minor = patch = 0
              latest = "(none)"

          bump = os.environ["BUMP"]
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch += 1
          else:
              print(f"::error::Unknown bump {bump!r}", file=sys.stderr)
              raise SystemExit(1)

          new_tag = f"v{major}.{minor}.{patch}"
          print(f"latest={latest}")
          print(f"tag={new_tag}")
          PY

      - name: Refuse if the tag already exists
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::${TAG} already exists, so the version maths picked a taken number."
            echo "Existing release tags:"
            git tag -l 'v*' | sort -V | tail -5
            exit 1
          fi

      - name: Create and push the tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"
          echo "Pushed ${TAG} at $(git rev-parse --short HEAD)"

      - name: Summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.latest }}
          BUMP: ${{ inputs.bump }}
        run: |
          {
            echo "### Tagged \`${TAG}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Previous release | \`${PREVIOUS}\` |"
            echo "| Bump | ${BUMP} |"
            echo "| Commit | \`$(git rev-parse --short HEAD)\` |"
            echo
            echo "Nothing has been published yet. To release it, run the"
            echo "**Publish to PyPI** workflow and enter \`${TAG}\` as the tag."
          } >> "$GITHUB_STEP_SUMMARY"
